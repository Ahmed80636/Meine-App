<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0B0E;--bg2:#111318;--bg3:#181C24;--bg4:#1F2430;
  --border:#1E2535;--border2:#2A3548;
  --text:#F0F2F7;--text2:#8A95A8;--text3:#4A5568;
  --accent:#6366F1;--accent2:#4F46E5;--accentg:#10B981;
  --red:#EF4444;--yellow:#F59E0B;--blue:#3B82F6;--purple:#8B5CF6;--cyan:#06B6D4;
  --push:#F97316;--pull:#14B8A6;--beine:#EAB308;--br:#EC4899;--arme:#22C55E;
  --cardio:#06B6D4;--mob:#F59E0B;--core:#8B5CF6;--rest:#6B7280;
  --r:10px;--font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}

/* NAV */
.nav{display:flex;background:rgba(17,19,24,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 .75rem;position:sticky;top:0;z-index:100;overflow-x:auto;gap:2px}
.nav::-webkit-scrollbar{display:none}
.nb{padding:14px 13px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:none;border:none;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--font);transition:color .2s}
.nb:hover{color:var(--text2)}
.nb.on{color:var(--accent);border-bottom-color:var(--accent)}

/* HEADER */
.hdr{padding:1.5rem 1.25rem .75rem}
.hdr-t{font-size:26px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--text) 0%,var(--text2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-s{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:5px;letter-spacing:.05em}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:10px;position:relative}
.card-glow{border-color:rgba(99,102,241,.25);box-shadow:0 0 20px rgba(99,102,241,.08)}

/* METRICS */
.mets{display:grid;gap:8px;padding:.75rem 1.25rem}
.met{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;transition:border-color .2s}
.met:hover{border-color:var(--border2)}
.met::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--mc,var(--accent));opacity:.4;border-radius:0 0 var(--r) var(--r)}
.ml{font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.mv{font-size:20px;font-weight:700;font-family:var(--mono)}
.ms{font-size:11px;color:var(--text2);margin-top:3px}
.pb{height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-top:8px}
.pf{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* WEEK */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 1.25rem .75rem}
.db{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 4px;text-align:center;cursor:pointer;transition:all .2s}
.db:hover{border-color:var(--border2);transform:translateY(-1px)}
.db.on{border-color:var(--accent);background:rgba(99,102,241,.08);box-shadow:0 0 16px rgba(99,102,241,.12)}
.db.dn{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.05)}
.ds{font-size:9px;color:var(--text3);font-family:var(--mono);letter-spacing:.04em}
.dn2{font-size:11px;font-weight:600;margin:3px 0}
.dd{width:6px;height:6px;border-radius:50%;margin:4px auto 0;transition:background .3s}

/* DETAIL */
.det{padding:0 1.25rem 2rem}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.dt{font-size:20px;font-weight:800;letter-spacing:-.02em}
.ds2{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:3px}
.tag{display:inline-block;font-size:9px;font-weight:700;padding:3px 8px;border-radius:5px;margin:2px 2px 2px 0;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase}
.sl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-family:var(--mono);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.exrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.exrow:last-child{border-bottom:none}
.exn{font-size:10px;color:var(--text3);font-family:var(--mono);min-width:18px;padding-top:2px}
.exname{flex:1;font-size:13px;font-weight:500;color:var(--text)}
.exnote{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.4}
.exs{font-size:11px;color:var(--accent);min-width:80px;text-align:right;font-family:var(--mono);font-weight:600;white-space:nowrap}
.tip{background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.2);border-left:3px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.tl{font-size:12px;color:var(--text2);padding:3px 0;display:flex;gap:8px;line-height:1.5}
.tl::before{content:'→';color:var(--accent);font-family:var(--mono);flex-shrink:0}
.brow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}

/* BUTTONS */
button{cursor:pointer;font-family:var(--font);border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--text2);padding:8px 14px;font-size:12px;font-weight:500;transition:all .2s}
button:hover{background:var(--bg3);color:var(--text)}
button:active{transform:scale(.97)}
.ba{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;font-weight:700!important;box-shadow:0 0 20px rgba(99,102,241,.3)}
.ba:hover{background:var(--accent2)!important;border-color:var(--accent2)!important}
.bg{background:var(--accentg)!important;color:#fff!important;border-color:var(--accentg)!important;font-weight:700!important}
.bdone{border-color:rgba(16,185,129,.4);color:var(--accentg)}
.bdone.on{background:rgba(16,185,129,.1);color:var(--accentg);border-color:var(--accentg)}

/* LOG */
.lw{padding:0 1.25rem 2rem}
.ec{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px}
.ech{padding:6px 11px;font-size:11px;font-weight:600;border-radius:7px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--text3);font-family:var(--mono);transition:all .2s}
.ech:hover{color:var(--text2);border-color:var(--border2)}
.ech.on{border-color:var(--accent);background:rgba(99,102,241,.1);color:var(--accent)}
.sr{display:grid;grid-template-columns:24px 1fr 1fr 28px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.sr:last-child{border-bottom:none}
.sn{font-size:10px;color:var(--text3);font-family:var(--mono);text-align:center}
input{font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text);width:100%;transition:border-color .2s}
input:focus{outline:none;border-color:var(--accent);background:var(--bg4)}
select{font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text);width:100%}
select:focus{outline:none;border-color:var(--accent)}
.lhint{background:var(--bg3);border-left:2px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:10px 13px;margin-bottom:13px;font-size:11px;color:var(--text3);font-family:var(--mono);line-height:1.7}
.hr2{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.hr2:last-child{border-bottom:none}
.prb{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(245,158,11,.12);color:var(--yellow);font-family:var(--mono);font-weight:700;border:1px solid rgba(245,158,11,.25);margin-left:4px}
.up{color:var(--accentg)}.dn3{color:var(--red)}
.empty{font-size:12px;color:var(--text3);text-align:center;padding:32px 0;font-family:var(--mono);line-height:2.2}
.zbar{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin:7px 0 5px}
.zfill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.zrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.zrow:last-child{border-bottom:none}
.gwr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.gwr:last-child{border-bottom:none}
.bulk{background:rgba(99,102,241,.05);border:1px solid rgba(99,102,241,.15);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--text2);line-height:1.7}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:var(--r);font-size:12px;font-family:var(--mono);z-index:9999;opacity:0;transition:all .3s;max-width:88vw;text-align:center;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.4)}

/* SCORE RING */
.score-ring{width:100px;height:100px;margin:0 auto 12px}
.score-ring svg{transform:rotate(-90deg)}
.score-ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}

/* SUP CHECKBOX */
.sup-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px;cursor:pointer;transition:all .2s}
.sup-item:hover{border-color:var(--border2)}
.sup-item.done{background:rgba(99,102,241,.05);border-color:rgba(99,102,241,.2)}
.sup-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.sup-item.done .sup-check{background:var(--accent);border-color:var(--accent)}
</style>
</head>

  <button class="nb" id="nb4" onclick="SP('prog')">Fortschritt</button>
  <button class="nb" id="nb5" onclick="SP('woche')">Woche</button>
  <button class="nb" id="nb6" onclick="SP('sups')">Supplemente</button>

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
function today(){return new Date().toISOString().split("T")[0];}
function fmt(d){const[y,m,day]=d.split("-");return day+"."+m+"."+y;}
function getPR(ex){let p=0;(tlog[ex]||[]).forEach(e=>e.sets.forEach(s=>{if((s.kg||0)>p)p=s.kg;}));return p;}
function getLast(ex){return([...(tlog[ex]||[])].sort((a,b)=>b.date.localeCompare(a.date))[0])||null;}
function get1RM(kg,reps){return kg&&reps?Math.round(kg*(1+reps/30)*10)/10:0;}
function getWD(){
  const now=new Date(),day=now.getDay(),diff=day===0?-6:1-day;
  const mon=new Date(now);mon.setDate(now.getDate()+diff);
  return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x.toISOString().split("T")[0];});
}
function getZM(zone){const wd=getWD();return(zlog[zone]||[]).filter(e=>wd.includes(e.date)).reduce((s,e)=>s+e.min,0);}
function getSGW(){return[...gwlog].sort((a,b)=>b.date.localeCompare(a.date));}
function getAvg7(){const s=getSGW();if(!s.length)return null;return Math.round(s.slice(0,7).reduce((a,e)=>a+e.kg,0)/Math.min(7,s.length)*10)/10;}
function getWC(){
  const s=getSGW();if(s.length<2)return null;
  const now=new Date();
  const c1=new Date(now);c1.setDate(now.getDate()-7);
  const c2=new Date(now);c2.setDate(now.getDate()-14);
  const w1=s.filter(e=>new Date(e.date)>=c1);
  const w2=s.filter(e=>new Date(e.date)>=c2&&new Date(e.date)<c1);
  if(!w1.length||!w2.length)return null;
  return Math.round((w1.reduce((a,e)=>a+e.kg,0)/w1.length-w2.reduce((a,e)=>a+e.kg,0)/w2.length)*100)/100;
}
function bulkStatus(wc){
  if(wc===null)return{l:"Noch keine Daten",c:"var(--text3)",i:"—"};
  if(wc<0)return{l:"Zu wenig — iss mehr!",c:"var(--red)",i:"↓"};
  if(wc<0.25)return{l:"Grenzwertig — mehr essen",c:"var(--yellow)",i:"↗"};
  if(wc<=0.5)return{l:"Perfekter Lean Bulk ✓",c:"var(--accentg)",i:"✓"};
  return{l:"Zu schnell — zurücknehmen",c:"var(--red)",i:"↑"};
}
function getStreak(){
  try{const r=localStorage.getItem(SKST);return r?JSON.parse(r):{current:0,best:0,lastWeek:null};}
  catch(e){return{current:0,best:0,lastWeek:null};}
}
function saveStreak(s){try{localStorage.setItem(SKST,JSON.stringify(s));}catch(e){}}
function getKW(){
  const now=new Date(),start=new Date(now.getFullYear(),0,1);
  return Math.ceil(((now-start)/86400000+start.getDay()+1)/7);
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.opacity="1";t.style.transform="translateX(-50%) translateY(0)";
  clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity="0";t.style.transform="translateX(-50%) translateY(20px)";},3000);
}
function SP(p){
  page=p;
  ["plan","log","zonen","gewicht","prog","woche","sups"].forEach((x,i)=>{
    const nb=document.getElementById("nb"+i);if(nb)nb.classList.toggle("on",x===p);
  });
  ["pp","pl","pz","pgw","pr2","pw","psup"].forEach((id,i)=>{
    const el=document.getElementById(id);
    if(el)el.style.display=(["plan","log","zonen","gewicht","prog","woche","sups"][i]===p)?"":"none";
  });
  render();
}
function render(){
  if(page==="plan")rPlan();
  else if(page==="log")rLog();
  else if(page==="zonen")rZonen();
  else if(page==="gewicht")rGW();
  else if(page==="woche")rWoche();
  else if(page==="sups")rSups();
  else rProg();
}

  const lb=e.target.closest(".lex-btn");
  if(lb){aex=lb.dataset.v;sets=[{kg:"",reps:""}];rLog();return;}
  const pb=e.target.closest(".pex-btn");
  if(pb){pgex=pb.dataset.v;rProg();return;}
  const ld2=e.target.closest(".lday-btn");
  if(ld2){ld=parseInt(ld2.dataset.v);aex=DAYS[ld].ex[0];sets=[{kg:"",reps:""}];rLog();return;}
  const pd2=e.target.closest(".pday-btn");

  const planD=e.target.closest(".plan-day-btn");

});

function drawGW(c){
  const s=[...gwlog].sort((a,b)=>a.date.localeCompare(b.date));
  const ctx=c.getContext("2d"),W=c.width,H=c.height,dpr=window.devicePixelRatio||1;
  ctx.clearRect(0,0,W,H);
  if(s.length<2){
    ctx.fillStyle="#4A5568";ctx.font=(11*dpr)+"px JetBrains Mono,monospace";
    ctx.textAlign="center";ctx.fillText("Mindestens 2 Einträge nötig",W/2,H/2);return;
  }
  const vals=s.map(p=>p.kg),mn=Math.min(...vals)*.996,mx=Math.max(...vals)*1.004;
  const pad={l:46,r:14,t:16,b:24},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  if(gwS.goalWeight){
    const gy=pad.t+cH-((gwS.goalWeight-mn)/(mx-mn))*cH;
    if(gy>pad.t-10&&gy<pad.t+cH+10){
      ctx.strokeStyle="rgba(99,102,241,.25)";ctx.lineWidth=1;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(pad.l+cW,gy);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle="rgba(99,102,241,.6)";ctx.font=(9*dpr)+"px JetBrains Mono,monospace";
      ctx.textAlign="right";ctx.fillText("Ziel",pad.l-4,gy+3);
    }
  }
  ctx.strokeStyle="rgba(255,255,255,.05)";ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.t+(cH/4)*i;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();
    ctx.fillStyle="#4A5568";ctx.font=(9*dpr)+"px JetBrains Mono,monospace";ctx.textAlign="right";
    ctx.fillText(Math.round((mx-(mx-mn)*(i/4))*10)/10,pad.l-4,y+3);
  }
  if(s.length>=4){
    ctx.beginPath();ctx.strokeStyle="rgba(99,102,241,.3)";ctx.lineWidth=1.5*dpr;ctx.setLineDash([3,3]);
    s.forEach((p,i)=>{
      const win=s.slice(Math.max(0,i-3),i+4);
      const avg=win.reduce((a,x)=>a+x.kg,0)/win.length;
      const x=pad.l+(i/(s.length-1))*cW,y=pad.t+cH-((avg-mn)/(mx-mn))*cH;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();ctx.setLineDash([]);
  }
  ctx.beginPath();
  s.forEach((p,i)=>{const x=pad.l+(i/(s.length-1))*cW,y=pad.t+cH-((p.kg-mn)/(mx-mn))*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.lineTo(pad.l+cW,pad.t+cH);ctx.lineTo(pad.l,pad.t+cH);ctx.closePath();
  const g=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);
  g.addColorStop(0,"rgba(99,102,241,.15)");g.addColorStop(1,"rgba(99,102,241,0)");
  ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.strokeStyle="#6366F1";ctx.lineWidth=2.5*dpr;
  s.forEach((p,i)=>{const x=pad.l+(i/(s.length-1))*cW,y=pad.t+cH-((p.kg-mn)/(mx-mn))*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();
  const step=Math.max(1,Math.floor(s.length/5));
  s.forEach((p,i)=>{
    const x=pad.l+(i/(s.length-1))*cW,y=pad.t+cH-((p.kg-mn)/(mx-mn))*cH;
    ctx.beginPath();ctx.arc(x,y,4*dpr,0,Math.PI*2);ctx.fillStyle="#6366F1";ctx.fill();
    ctx.beginPath();ctx.arc(x,y,2*dpr,0,Math.PI*2);ctx.fillStyle="#0A0B0E";ctx.fill();
    if(i%step===0||i===s.length-1){
      const[,m,day]=p.date.split("-");
      ctx.fillStyle="#4A5568";ctx.font=(9*dpr)+"px JetBrains Mono,monospace";
      ctx.textAlign="center";ctx.fillText(day+"."+m,x,H-2);
    }
  });
}

  const note=document.getElementById("gwn")?.value.trim()||"";

  if(!kg||kg<30||kg>300){msg.style.color="var(--red)";msg.textContent="Bitte gültiges Gewicht eingeben";return;}

  if(!gwS.startWeight)gwS.startWeight=kg;
  gwlog=gwlog.filter(e=>e.date!==today());
  gwlog.push({date:today(),kg,note});
  SS();msg.style.color="var(--accent)";msg.textContent="✓ GESPEICHERT";

}

function drawChart(c,exName){
  const entries=[...(tlog[exName]||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const pts=entries.map(e=>({date:e.date,maxKg:Math.max(...e.sets.map(s=>s.kg||0))})).filter(p=>p.maxKg>0);
  const ctx=c.getContext("2d"),W=c.width,H=c.height,dpr=window.devicePixelRatio||1;
  ctx.clearRect(0,0,W,H);
  if(pts.length<2){
    ctx.fillStyle="#4A5568";ctx.font=(11*dpr)+"px JetBrains Mono,monospace";
    ctx.textAlign="center";ctx.fillText("Noch zu wenig Daten",W/2,H/2);return;
  }
  const vals=pts.map(p=>p.maxKg),mn=Math.min(...vals)*.96,mx=Math.max(...vals)*1.04;
  const pad={l:44,r:12,t:12,b:22},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  ctx.strokeStyle="rgba(255,255,255,.05)";ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.t+(cH/4)*i;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();
    ctx.fillStyle="#4A5568";ctx.font=(9*dpr)+"px JetBrains Mono,monospace";ctx.textAlign="right";
    ctx.fillText(Math.round((mx-(mx-mn)*(i/4))*10)/10,pad.l-4,y+3);
  }
  ctx.beginPath();
  pts.forEach((p,i)=>{const x=pad.l+(i/(pts.length-1))*cW,y=pad.t+cH-((p.maxKg-mn)/(mx-mn))*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.lineTo(pad.l+cW,pad.t+cH);ctx.lineTo(pad.l,pad.t+cH);ctx.closePath();
  const g=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);
  g.addColorStop(0,"rgba(99,102,241,.18)");g.addColorStop(1,"rgba(99,102,241,0)");
  ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.strokeStyle="#6366F1";ctx.lineWidth=2.5*dpr;
  pts.forEach((p,i)=>{const x=pad.l+(i/(pts.length-1))*cW,y=pad.t+cH-((p.maxKg-mn)/(mx-mn))*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();
  const step=Math.max(1,Math.floor(pts.length/5));
  pts.forEach((p,i)=>{
    const x=pad.l+(i/(pts.length-1))*cW,y=pad.t+cH-((p.maxKg-mn)/(mx-mn))*cH;
    ctx.beginPath();ctx.arc(x,y,4*dpr,0,Math.PI*2);ctx.fillStyle="#6366F1";ctx.fill();
    ctx.beginPath();ctx.arc(x,y,2*dpr,0,Math.PI*2);ctx.fillStyle="#0A0B0E";ctx.fill();
    if(i%step===0||i===pts.length-1){
      const[,m,day]=p.date.split("-");
      ctx.fillStyle="#4A5568";ctx.font=(9*dpr)+"px JetBrains Mono,monospace";
      ctx.textAlign="center";ctx.fillText(day+"."+m,x,H-2);
    }
  });
}

function getKW(){
  const now=new Date(),start=new Date(now.getFullYear(),0,1);
  return Math.ceil(((now-start)/86400000+start.getDay()+1)/7);
}

function generateFeedback(days,z13,z45,wc,prs){
  const fb=[];
  if(days>=6)fb.push({icon:"💪",text:"Hervorragend — "+days+"/7 Tage trainiert!"});
  else if(days>=5)fb.push({icon:"✅",text:days+" Tage — Streak bleibt am Leben."});
  else if(days>=3)fb.push({icon:"⚠️",text:"Nur "+days+" Tage — Ziel ist mindestens 5."});
  else fb.push({icon:"❌",text:"Zu wenig Trainingstage. Auch kurze Sessions zählen!"});
  if(z13>=Z13G)fb.push({icon:"🟢",text:"Zone 1–3 Ziel erreicht ("+z13+" min) — Ausdauer wächst."});
  else fb.push({icon:"🔵",text:"Zone 1–3: "+z13+"/"+Z13G+" min — noch "+(Z13G-z13)+" min fehlen."});
  if(z45>=Z45G)fb.push({icon:"🔥",text:"Zone 4–5 Ziel erreicht ("+z45+" min) — VO2max steigt!"});
  else fb.push({icon:"🟡",text:"Zone 4–5: "+z45+"/"+Z45G+" min — Boxsack nicht vergessen."});
  if(wc===null)fb.push({icon:"⚖️",text:"Noch zu wenig Gewichtsdaten. Täglich morgens wiegen!"});
  else if(wc>=0.25&&wc<=0.5)fb.push({icon:"⚖️",text:"Gewicht +"+wc+"kg — perfekter Lean Bulk! Weiter so."});
  else if(wc>0.5)fb.push({icon:"⚖️",text:"Gewicht +"+wc+"kg — etwas schnell. 100–200 kcal weniger?"});
  else if(wc>0)fb.push({icon:"⚖️",text:"Gewicht +"+wc+"kg — grenzwertig. Mehr essen nächste Woche."});
  else fb.push({icon:"⚖️",text:"Kein Gewichtszuwachs — Kalorien überprüfen!"});
  if(prs>0)fb.push({icon:"🏆",text:prs+" neue persönliche Rekorde — stark!"});
  return fb;
}

function markWeekDone(){
  const wd=getWD(),kw=getKW();
  const z13=getZM("1-3"),z45=getZM("4-5"),wc=getWC();
  const s=getStreak();
  const sunday=wd[6];
  const thisWeekStr=wd[0];
  if(s.lastWeek!==thisWeekStr){
    if(done.size>=5){s.current++;s.best=Math.max(s.best,s.current);}
    else s.current=0;
    s.lastWeek=thisWeekStr;
    saveStreak(s);
  }
  const weekLogs={};
  Object.entries(tlog).forEach(([ex,entries])=>{
    const we=entries.filter(e=>wd.includes(e.date));
    if(we.length)weekLogs[ex]=we;
  });
  const weekPRs=[];
  Object.entries(tlog).forEach(([ex,entries])=>{
    const pr=getPR(ex);if(!pr)return;
    entries.filter(e=>wd.includes(e.date)).forEach(e=>{
      const mx=Math.max(...e.sets.map(s=>s.kg||0));
      if(mx===pr)weekPRs.push({ex,kg:pr});
    });
  });
  let score=Math.min(done.size,7)*10;
  score+=z13>=Z13G?15:Math.round(z13/Z13G*15);
  score+=z45>=Z45G?15:Math.round(z45/Z45G*15);
  score=Math.min(score,100);
  warchiv.unshift({kw,weekStart:wd[0],weekEnd:wd[6],trainedDays:done.size,score,z13,z45,gewichtDelta:wc||0,prs:weekPRs,archivedAt:new Date().toISOString()});
  if(warchiv.length>52)warchiv=warchiv.slice(0,52);
  done=new Set();
  SS();
  toast("Woche archiviert! Streak: "+s.current+" Wochen 🔥");
  rWoche();
}

function exportFuerClaude(){
  const wd=getWD(),z13=getZM("1-3"),z45=getZM("4-5"),wc=getWC(),streak=getStreak(),sgw=getSGW();
  let score=Math.min(done.size,7)*10;
  score+=z13>=Z13G?15:Math.round(z13/Z13G*15);
  score+=z45>=Z45G?15:Math.round(z45/Z45G*15);
  score=Math.min(score,100);
  const weekLogs={};
  Object.entries(tlog).forEach(([ex,entries])=>{
    const we=entries.filter(e=>wd.includes(e.date));
    if(we.length)weekLogs[ex]=we;
  });
  const allPRs={};
  Object.keys(tlog).forEach(ex=>{const p=getPR(ex);if(p)allPRs[ex]=p;});
  const data={
    exportDatum:new Date().toLocaleDateString("de-DE"),kw:getKW(),
    aktuelleWoche:{trainedDays:done.size,score,z13_min:z13,z13_ziel:Z13G,z45_min:z45,z45_ziel:Z45G,gewichtDelta:wc||0,aktuellesGewicht:sgw[0]||null,logs:weekLogs},
    streak:{aktuell:streak.current,beste:streak.best},
    gewichtVerlauf:sgw.slice(0,30),allePersonalRecords:allPRs,
    wochenArchiv:warchiv.slice(0,12),
    supplemente:{heute:suplog[today()]||{},letzteWoche:Object.fromEntries(Object.entries(suplog).slice(-7))}
  };
  const text="TRAINING EXPORT — KW "+data.kw+" ("+data.exportDatum+")\n\n"+JSON.stringify(data,null,2);
  navigator.clipboard.writeText(text).then(()=>{toast("📋 Kopiert! In Claude einfügen.");}).catch(()=>{
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90vw;height:60vh;z-index:9999;font-size:11px;padding:10px;background:var(--bg2);color:var(--text);border:1px solid var(--accent);border-radius:8px";
    document.body.appendChild(ta);ta.select();
    toast("Markieren → Kopieren → In Claude einfügen");
    setTimeout(()=>ta.remove(),30000);
  });
}
function importDaten(){
  const raw=prompt("Export-Daten einfügen:");
  if(!raw)return;
  try{
    const text=raw.startsWith("TRAINING EXPORT")?raw.substring(raw.indexOf("\n\n")+2):raw;
    const data=JSON.parse(text);
    if(data.wochenArchiv)warchiv=data.wochenArchiv;
    SS();toast("✓ Importiert!");render();
  }catch(e){toast("Fehler — falsches Format");}
}

// ══════════════════════════════════════════════
// SUPPLEMENTE
// ══════════════════════════════════════════════
function toggleSup(id){
  const t=today();
  if(!suplog[t])suplog[t]={};
  if(suplog[t][id])delete suplog[t][id];
  else suplog[t][id]=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  SS();rSups();
}
function rSups(){
  const el=document.getElementById("psup");
  const td=suplog[today()]||{};
  const total=SUPPLEMENTS.length,taken=Object.keys(td).length;
  const pct=Math.round(taken/total*100);
  let streak=0;
  const d=new Date();d.setDate(d.getDate()-1);
  while(streak<365){
    const key=d.toISOString().split("T")[0];
    if(Object.keys(suplog[key]||{}).length===total){streak++;d.setDate(d.getDate()-1);}else break;
  }
  const week=[];
  for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);const k=x.toISOString().split("T")[0];week.push({date:k,taken:Object.keys(suplog[k]||{}).length,label:["So","Mo","Di","Mi","Do","Fr","Sa"][x.getDay()]});}
  const slots=[{key:"morgens",label:"Morgens",color:"var(--yellow)"},{key:"mittags",label:"Tagsüber / vor Training",color:"var(--blue)"},{key:"abends",label:"Abends",color:"var(--purple)"}];

  let h=`<div class="hdr">
    <div class="hdr-t">Supplemente</div>
    <div class="hdr-s">${taken}/${total} HEUTE · STREAK ${streak} TAGE</div>
  </div>
  <div class="lw">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:13px;font-weight:500;color:${pct===100?"var(--accentg)":"var(--text2)"}">${pct===100?"✓ Alle genommen!":taken+" / "+total+" genommen"}</div>
        <div style="font-size:24px;font-weight:800;font-family:var(--mono);color:${pct===100?"var(--accentg)":"var(--text)"}">${pct}%</div>
      </div>
      <div class="pb" style="height:6px"><div class="pf" style="width:${pct}%;background:${pct===100?"var(--accentg)":"linear-gradient(90deg,var(--accent),var(--accentg))"}"></div></div>
    </div>
    <div class="card">
      <div style="font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:.07em;margin-bottom:10px">LETZTE 7 TAGE</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">
        ${week.map(w=>{
          const isToday=w.date===today();
          const col=w.taken===total?"var(--accentg)":w.taken>0?"var(--accent)":"var(--border2)";
          return`<div style="text-align:center">
            <div style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">${w.label}</div>
            <div style="width:32px;height:32px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:${w.taken===total?"rgba(16,185,129,.12)":w.taken>0?"rgba(99,102,241,.1)":"var(--bg3)"};border:${isToday?"2px solid var(--accent)":"1.5px solid "+col}">
              <span style="font-size:11px;font-weight:700;font-family:var(--mono);color:${col}">${w.taken}</span>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>`;

  slots.forEach(slot=>{
    const sups=SUPPLEMENTS.filter(s=>s.slot===slot.key);
    h+=`<div style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-family:var(--mono);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
      <div style="width:6px;height:6px;border-radius:50%;background:${slot.color}"></div>${slot.label}
    </div>`;
    sups.forEach(sup=>{
      const done=!!td[sup.id],time=td[sup.id]||"";
      h+=`<div onclick="toggleSup('${sup.id}')" class="sup-item${done?" done":""}">
        <div class="sup-check">
          ${done?`<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}
        </div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:${done?"600":"500"};color:var(--text)">${sup.name}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${sup.dose} · ${sup.note}</div>
        </div>
        ${done?`<div style="font-size:10px;color:var(--accent);font-family:var(--mono);font-weight:600">${time}</div>`:`<div style="width:8px;height:8px;border-radius:50%;background:${sup.color};opacity:.5"></div>`}
      </div>`;
    });
  });

  h+=`<div style="margin-top:10px;text-align:center;font-size:11px;color:var(--text3);font-family:var(--mono);line-height:2">Antippen = genommen / rückgängig<br>Resettet automatisch täglich um Mitternacht</div></div>`;
  el.innerHTML=h;
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
LS();render();
</script>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainingsapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0E0F11;--bg2:#161719;--bg3:#1E2024;
  --border:#2A2C31;--border2:#353840;
  --text:#F0F0EE;--text2:#9A9B9F;--text3:#5A5C62;
  --accent:#C8F23A;--accent2:#A8D420;
  --push:#FF6B4A;--pull:#4A9EFF;--beine:#FFB84A;
  --br:#FF4A8A;--arme:#4AFFB8;--cardio:#4AFFD4;
  --core:#B84AFF;--mob:#FFD44A;--rest:#5A5C62;
  --z13:#4AFFD4;--z45:#FF6B4A;
  --r:10px;--font:'Syne',sans-serif;--mono:'DM Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 .75rem;gap:1px;overflow-x:auto;position:sticky;top:0;z-index:100}
.nb{padding:12px 12px;font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.nb:hover{color:var(--text2)}.nb.on{color:var(--accent);border-bottom-color:var(--accent)}
.hdr{padding:1.25rem 1.25rem .75rem;border-bottom:1px solid var(--border)}
.hdr-t{font-size:24px;font-weight:800;letter-spacing:-.02em}
.hdr-s{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:3px;letter-spacing:.04em}
.mets{display:grid;gap:8px;padding:1rem 1.25rem}
.met{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.ml{font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.mv{font-size:19px;font-weight:700}.ms{font-size:11px;color:var(--text3);margin-top:2px}
.pb{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:7px}
.pf{height:100%;border-radius:3px;transition:width .5s}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 1.25rem .75rem}
.db{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:9px 4px;text-align:center;cursor:pointer;transition:border-color .15s}
.db:hover{border-color:var(--border2)}.db.on{border:1.5px solid var(--accent);background:#111A04}.db.dn{border-color:#2A4008;background:#0D1205}
.ds{font-size:10px;color:var(--text3);font-family:var(--mono)}.dn2{font-size:11px;font-weight:700;margin:3px 0}.dd{width:6px;height:6px;border-radius:50%;margin:4px auto 0}
.det{padding:0 1.25rem 1.5rem}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.dt{font-size:19px;font-weight:800;letter-spacing:-.01em}.ds2{font-size:12px;color:var(--text3);font-family:var(--mono);margin-top:3px}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;margin:2px 2px 2px 0;font-family:var(--mono)}
.sl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);font-family:var(--mono);margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.ex{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}.ex:last-child{border-bottom:none}
.en{flex:1;font-size:13px;font-weight:500}.eno{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.4}
.es{font-size:11px;color:var(--text2);min-width:78px;text-align:right;font-family:var(--mono);white-space:nowrap}
.tip{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r);padding:11px 13px;margin-top:14px}
.tl{font-size:12px;color:var(--text2);padding:2px 0}
button{cursor:pointer;font-family:var(--font);border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--text2);padding:7px 13px;font-size:12px;font-weight:500;transition:all .15s}
button:hover{background:var(--bg3);color:var(--text)}
.ba{background:var(--accent)!important;color:#0E0F11!important;border-color:var(--accent)!important;font-weight:700!important}
.ba:hover{background:var(--accent2)!important}
.bdone{border-color:#2A4008;color:#6AA020}.bdone.on{background:#111A04;color:var(--accent);border-color:var(--accent)}
.brow{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
.lw{padding:0 1.25rem 1.5rem}
.ec{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.ech{padding:5px 10px;font-size:11px;font-weight:600;border-radius:6px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--text3);font-family:var(--mono);transition:all .15s}
.ech:hover{color:var(--text2);border-color:var(--border2)}.ech.on{border-color:var(--accent);background:#111A04;color:var(--accent)}
.lc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:12px}
.sr{display:grid;grid-template-columns:26px 1fr 1fr 26px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}.sr:last-child{border-bottom:none}
.sn{font-size:11px;color:var(--text3);font-family:var(--mono);text-align:center}
input[type=number],input[type=text]{font-family:var(--mono);font-size:12px;padding:7px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);width:100%;transition:border-color .15s}
input:focus{outline:none;border-color:var(--accent)}
.lh{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;margin-bottom:12px;font-size:11px;color:var(--text3);font-family:var(--mono);line-height:1.6}
.hr2{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}.hr2:last-child{border-bottom:none}
.prb{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;background:#2A1A08;color:var(--mob);font-family:var(--mono);font-weight:600;border:1px solid #3A2A10;vertical-align:middle;margin-left:4px}
.up{color:var(--accent)}.dn3{color:var(--push)}
.empty{font-size:12px;color:var(--text3);text-align:center;padding:28px 0;font-family:var(--mono)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.zone-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:10px}
.zone-log-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}.zone-log-row:last-child{border-bottom:none}
select{font-family:var(--mono);font-size:12px;padding:7px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);width:100%}
select:focus{outline:none;border-color:var(--accent)}
.gw-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}.gw-row:last-child{border-bottom:none}
.bulk-tip{background:#111A04;border:1px solid #2A4008;border-left:3px solid var(--accent);border-radius:var(--r);padding:10px 13px;margin-bottom:10px;font-size:12px;color:var(--text2);line-height:1.6}
</style>
</head>

let done=new Set(),tlog={},zlog={},gwlog=[],gwSettings={startWeight:null,goalWeight:null};

// localStorage persistence (works as local HTML file)
function loadData(){
  try{const d=localStorage.getItem(SK_D);if(d)done=new Set(JSON.parse(d));}catch(e){}
  try{const d=localStorage.getItem(SK_L);if(d)tlog=JSON.parse(d);}catch(e){}
  try{const d=localStorage.getItem(SK_Z);if(d)zlog=JSON.parse(d);}catch(e){}
  try{const d=localStorage.getItem(SK_GW);if(d)gwlog=JSON.parse(d);}catch(e){}
  try{const d=localStorage.getItem(SK_GS);if(d)gwSettings=JSON.parse(d);}catch(e){}
}
function saveData(){
  try{localStorage.setItem(SK_D,JSON.stringify([...done]));}catch(e){}
  try{localStorage.setItem(SK_L,JSON.stringify(tlog));}catch(e){}
  try{localStorage.setItem(SK_Z,JSON.stringify(zlog));}catch(e){}
  try{localStorage.setItem(SK_GW,JSON.stringify(gwlog));}catch(e){}
  try{localStorage.setItem(SK_GS,JSON.stringify(gwSettings));}catch(e){}
}

function today(){return new Date().toISOString().split("T")[0];}
function fmt(d){const[y,m,day]=d.split("-");return`${day}.${m}.${y}`;}
function getPR(ex){let p=0;(tlog[ex]||[]).forEach(e=>e.sets.forEach(s=>{if(s.kg>p)p=s.kg;}));return p;}
function getLast(ex){return([...(tlog[ex]||[])].sort((a,b)=>b.date.localeCompare(a.date))[0])||null;}
function get1RM(kg,reps){return kg&&reps?Math.round(kg*(1+reps/30)*10)/10:0;}
function getWeekStart(){const now=new Date();const day=now.getDay();const diff=day===0?-6:1-day;const mon=new Date(now);mon.setDate(now.getDate()+diff);return mon.toISOString().split("T")[0];}
function getWeekDates(){const ws=getWeekStart();const d=new Date(ws);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x.toISOString().split("T")[0];});}
function getZoneMin(zone){const wd=getWeekDates();return(zlog[zone]||[]).filter(e=>wd.includes(e.date)).reduce((s,e)=>s+e.min,0);}
function getSortedGW(){return[...gwlog].sort((a,b)=>b.date.localeCompare(a.date));}
function getGWAvg7(){const s=getSortedGW();if(!s.length)return null;return Math.round(s.slice(0,7).reduce((a,e)=>a+e.kg,0)/Math.min(7,s.length)*10)/10;}
function getWeeklyChange(){
  const s=getSortedGW();if(s.length<2)return null;
  const now=new Date();const c1=new Date(now);c1.setDate(now.getDate()-7);const c2=new Date(now);c2.setDate(now.getDate()-14);
  const w1=s.filter(e=>new Date(e.date)>=c1);const w2=s.filter(e=>new Date(e.date)>=c2&&new Date(e.date)<c1);
  if(!w1.length||!w2.length)return null;
  return Math.round((w1.reduce((a,e)=>a+e.kg,0)/w1.length-w2.reduce((a,e)=>a+e.kg,0)/w2.length)*100)/100;
}
function getBulkStatus(wc){
  if(wc===null)return{label:"Noch keine Daten",color:"var(--text3)",icon:"—"};
  if(wc<0)return{label:"Zu wenig — iss mehr!",color:"var(--push)",icon:"↓"};
  if(wc<BULK_RATE_MIN)return{label:"Grenzwertig — etwas mehr essen",color:"var(--mob)",icon:"↗"};
  if(wc<=BULK_RATE_MAX)return{label:"Perfekter Lean Bulk ✓",color:"var(--accent)",icon:"✓"};
  return{label:"Zu schnell — etwas zurücknehmen",color:"var(--z45)",icon:"↑"};
}

function setPage(p){
  page=p;
  ["plan","log","zonen","gewicht","prog"].forEach((x,i)=>{document.querySelectorAll(".nb")[i].classList.toggle("on",x===p);});
  ["pp","pl","pz","pgw","pr2"].forEach((id,i)=>{document.getElementById(id).style.display=(["plan","log","zonen","gewicht","prog"][i]===p)?"":"none";});
  render();
}

function render(){
  if(page==="plan")rPlan();
  else if(page==="log")rLog();
  else if(page==="zonen")rZonen();
  else if(page==="gewicht")rGewicht();
  else rProg();
}

function drawGWChart(canvas){
  const sorted=[...gwlog].sort((a,b)=>a.date.localeCompare(b.date));
  const ctx=canvas.getContext("2d");const W=canvas.width,H=canvas.height,dpr=window.devicePixelRatio||1;
  ctx.clearRect(0,0,W,H);
  if(sorted.length<2){ctx.fillStyle="#5A5C62";ctx.font=`${11*dpr}px DM Mono,monospace`;ctx.textAlign="center";ctx.fillText("Mindestens 2 Einträge für den Verlauf",W/2,H/2);return;}
  const vals=sorted.map(p=>p.kg);const mn=Math.min(...vals)*0.995,mx=Math.max(...vals)*1.005;
  const pad={l:48,r:14,t:16,b:26};const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  if(gwSettings.goalWeight){const gy=pad.t+cH-((gwSettings.goalWeight-mn)/(mx-mn))*cH;if(gy>pad.t&&gy<pad.t+cH){ctx.strokeStyle="rgba(200,242,58,0.25)";ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(pad.l+cW,gy);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="rgba(200,242,58,0.5)";ctx.font=`${9*dpr}px DM Mono,monospace`;ctx.textAlign="right";ctx.fillText("Ziel",pad.l-4,gy+3);}}
  ctx.strokeStyle="rgba(255,255,255,0.05)";ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad.t+(cH/4)*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();ctx.fillStyle="#5A5C62";ctx.font=`${9*dpr}px DM Mono,monospace`;ctx.textAlign="right";ctx.fillText(Math.round((mx-(mx-mn)*(i/4))*10)/10+"kg",pad.l-5,y+3);}
  if(sorted.length>=4){ctx.beginPath();ctx.strokeStyle="rgba(200,242,58,0.3)";ctx.lineWidth=1.5*dpr;ctx.setLineDash([3,3]);sorted.forEach((p,i)=>{const win=sorted.slice(Math.max(0,i-3),i+4);const avg=win.reduce((s,x)=>s+x.kg,0)/win.length;const x=pad.l+(i/(sorted.length-1))*cW,y=pad.t+cH-((avg-mn)/(mx-mn))*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();ctx.setLineDash([]);}
  ctx.beginPath();sorted.forEach((p,i)=>{const x=pad.l+(i/(sorted.length-1))*cW,y=pad.t+cH-((p.kg-mn)/(mx-mn))*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.lineTo(pad.l+cW,pad.t+cH);ctx.lineTo(pad.l,pad.t+cH);ctx.closePath();
  const g=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);g.addColorStop(0,"rgba(200,242,58,0.12)");g.addColorStop(1,"rgba(200,242,58,0)");ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.strokeStyle="#C8F23A";ctx.lineWidth=2*dpr;sorted.forEach((p,i)=>{const x=pad.l+(i/(sorted.length-1))*cW,y=pad.t+cH-((p.kg-mn)/(mx-mn))*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  const step=Math.max(1,Math.floor(sorted.length/5));
  sorted.forEach((p,i)=>{const x=pad.l+(i/(sorted.length-1))*cW,y=pad.t+cH-((p.kg-mn)/(mx-mn))*cH;ctx.beginPath();ctx.arc(x,y,3.5*dpr,0,Math.PI*2);ctx.fillStyle="#C8F23A";ctx.fill();ctx.beginPath();ctx.arc(x,y,1.5*dpr,0,Math.PI*2);ctx.fillStyle="#0E0F11";ctx.fill();if(i%step===0||i===sorted.length-1){const[,m,d]=p.date.split("-");ctx.fillStyle="#5A5C62";ctx.font=`${9*dpr}px DM Mono,monospace`;ctx.textAlign="center";ctx.fillText(`${d}.${m}`,x,H-3);}});
}

    </div>
    <div class="lc">
      <div style="font-size:13px;font-weight:700;margin-bottom:12px">Heute eintragen</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div><div style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">GEWICHT (KG)</div><input type="number" id="gw-inp" step="0.1" min="30" max="300" placeholder="z.B. 76.5"></div>
        <div><div style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">ZIELGEWICHT</div><input type="number" id="gw-goal" step="0.5" min="30" max="300" placeholder="z.B. 90.0" value="${gwSettings.goalWeight||""}"></div>
      </div>
      <div style="margin-bottom:10px"><div style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">NOTIZ</div><input type="text" id="gw-note" placeholder="z.B. nach Training"></div>
      <button class="ba" onclick="saveGW()" style="width:100%">Gewicht speichern</button>
      <div id="gwmsg" style="font-size:11px;text-align:center;margin-top:7px;min-height:15px;font-family:var(--mono);color:var(--accent)"></div>
    </div>
    <div class="lc">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">Verlauf</div>
      <div style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:10px">— Gewicht &nbsp;···&nbsp; 7-Tage Ø &nbsp;···&nbsp; Ziel</div>
      <canvas id="gwchart" style="width:100%;height:170px;display:block"></canvas>
    </div>
    <div class="lc"><div style="font-size:13px;font-weight:700;margin-bottom:10px">Verlaufs-Historie</div>`;
  if(!sorted.length){h+=`<div class="empty">NOCH KEINE EINTRÄGE<br><span style="font-size:10px;margin-top:4px;display:block">Täglich morgens nüchtern wiegen</span></div>`;}
  else{sorted.slice(0,14).forEach((e,i)=>{const prev=sorted[i+1];const df=prev?Math.round((e.kg-prev.kg)*100)/100:null;h+=`<div class="gw-row"><div style="font-size:11px;color:var(--text3);font-family:var(--mono);min-width:64px">${fmt(e.date)}</div><div style="font-size:14px;font-weight:700;font-family:var(--mono);flex:1">${e.kg} kg</div>${df!==null?`<div style="font-size:11px;font-family:var(--mono)" class="${df>0?"up":"dn3"}">${df>0?"+":""}${df}kg</div>`:""} ${e.note?`<div style="font-size:11px;color:var(--text3);flex:1;text-align:right;padding-right:6px">${e.note}</div>`:""}<button onclick="delGW('${e.date}')" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:2px 5px">✕</button></div>`;});}
  h+=`</div></div>`;el.innerHTML=h;
  requestAnimationFrame(()=>{const c=document.getElementById("gwchart");if(c){const dpr=window.devicePixelRatio||1;c.width=c.offsetWidth*dpr;c.height=170*dpr;c.style.height="170px";drawGWChart(c);}});
}
function saveGW(){
  const kg=parseFloat(document.getElementById("gw-inp")?.value);
  const goal=parseFloat(document.getElementById("gw-goal")?.value)||null;
  const note=document.getElementById("gw-note")?.value.trim()||"";
  if(!kg||kg<30||kg>300){document.getElementById("gwmsg").style.color="var(--push)";document.getElementById("gwmsg").textContent="Bitte gültiges Gewicht eingeben";return;}
  if(goal)gwSettings.goalWeight=goal;
  if(!gwSettings.startWeight)gwSettings.startWeight=kg;
  gwlog=gwlog.filter(e=>e.date!==today());
  gwlog.push({date:today(),kg,note});
  saveData();document.getElementById("gwmsg").style.color="var(--accent)";document.getElementById("gwmsg").textContent="✓ GESPEICHERT";
  setTimeout(()=>rGewicht(),600);
}
function delGW(date){gwlog=gwlog.filter(e=>e.date!==date);saveData();rGewicht();}

function drawC(canvas,exName){
  const entries=[...(tlog[exName]||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const pts=entries.map(e=>({date:e.date,maxKg:Math.max(...e.sets.map(s=>s.kg||0))})).filter(p=>p.maxKg>0);
  const ctx=canvas.getContext("2d");const W=canvas.width,H=canvas.height,dpr=window.devicePixelRatio||1;
  ctx.clearRect(0,0,W,H);
  if(pts.length<2){ctx.fillStyle="#5A5C62";ctx.font=`${11*dpr}px DM Mono,monospace`;ctx.textAlign="center";ctx.fillText("Noch zu wenig Daten",W/2,H/2);return;}
  const vals=pts.map(p=>p.maxKg);const mn=Math.min(...vals)*0.96,mx=Math.max(...vals)*1.04;
  const pad={l:46,r:14,t:14,b:26};const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  ctx.strokeStyle="rgba(255,255,255,0.05)";ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad.t+(cH/4)*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();ctx.fillStyle="#5A5C62";ctx.font=`${9*dpr}px DM Mono,monospace`;ctx.textAlign="right";ctx.fillText(Math.round((mx-(mx-mn)*(i/4))*10)/10+"kg",pad.l-5,y+3);}
  ctx.beginPath();pts.forEach((p,i)=>{const x=pad.l+(i/(pts.length-1))*cW,y=pad.t+cH-((p.maxKg-mn)/(mx-mn))*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.lineTo(pad.l+cW,pad.t+cH);ctx.lineTo(pad.l,pad.t+cH);ctx.closePath();
  const g=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);g.addColorStop(0,"rgba(200,242,58,0.18)");g.addColorStop(1,"rgba(200,242,58,0)");ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.strokeStyle="#C8F23A";ctx.lineWidth=2*dpr;pts.forEach((p,i)=>{const x=pad.l+(i/(pts.length-1))*cW,y=pad.t+cH-((p.maxKg-mn)/(mx-mn))*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  const step=Math.max(1,Math.floor(pts.length/5));
  pts.forEach((p,i)=>{const x=pad.l+(i/(pts.length-1))*cW,y=pad.t+cH-((p.maxKg-mn)/(mx-mn))*cH;ctx.beginPath();ctx.arc(x,y,4*dpr,0,Math.PI*2);ctx.fillStyle="#C8F23A";ctx.fill();ctx.beginPath();ctx.arc(x,y,2*dpr,0,Math.PI*2);ctx.fillStyle="#0E0F11";ctx.fill();if(i%step===0||i===pts.length-1){const[,m,d]=p.date.split("-");ctx.fillStyle="#5A5C62";ctx.font=`${9*dpr}px DM Mono,monospace`;ctx.textAlign="center";ctx.fillText(`${d}.${m}`,x,H-3);}});
}

function rProg(){
  const el=document.getElementById("pr2");
  if(!DAYS[pgd].ex.includes(pgex))pgex=DAYS[pgd].ex[0];
  const entries=[...(tlog[pgex]||[])].sort((a,b)=>b.date.localeCompare(a.date));
  const pr=getPR(pgex);
  const allPRs=Object.entries(tlog).map(([ex,e])=>({ex,pr:getPR(ex)})).filter(x=>x.pr>0).sort((a,b)=>b.pr-a.pr).slice(0,8);
  let h=`<div class="hdr"><div class="hdr-t">Fortschritt</div><div class="hdr-s">VERLAUF · PERSÖNLICHE REKORDE</div></div>
  <div class="lw">
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${DAYS.map((d,i)=>`<button class="db${i===pgd?" on":""}" style="padding:6px 10px;min-width:0" onclick="pgd=${i};pgex=DAYS[${i}].ex[0];rProg()"><div class="ds">${d.s}</div><div class="dn2" style="font-size:10px">${d.n}</div></button>`).join("")}</div>
    <div class="ec">${DAYS[pgd].ex.map(e=>`<button class="ech${e===pgex?" on":""}" onclick="pgex=${JSON.stringify(e)};rProg()">${e}</button>`).join("")}</div>
    <div class="lc" style="margin-bottom:12px"><div style="font-size:13px;font-weight:700;margin-bottom:10px">${pgex} — Verlauf</div><canvas id="pgc" style="width:100%;height:155px;display:block"></canvas></div>`;
  if(allPRs.length){h+=`<div class="lc" style="margin-bottom:12px"><div style="font-size:9px;font-family:var(--mono);letter-spacing:.07em;color:var(--text3);font-weight:700;margin-bottom:10px">TOP PERSÖNLICHE REKORDE</div>${allPRs.map(x=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><div style="font-size:12px">${x.ex}</div><div style="font-size:13px;font-weight:700;color:var(--accent);font-family:var(--mono)">${x.pr} kg</div></div>`).join("")}</div>`;}
  h+=`<div class="lc"><div style="font-size:9px;font-family:var(--mono);letter-spacing:.07em;color:var(--text3);font-weight:700;margin-bottom:10px">EINHEITEN-HISTORIE</div>`;
  if(!entries.length){h+=`<div class="empty">NOCH KEINE EINTRÄGE</div>`;}
  else{entries.forEach((e,i)=>{const mx=Math.max(...e.sets.map(s=>s.kg||0));const prev=entries[i+1];const pm=prev?Math.max(...prev.sets.map(s=>s.kg||0)):null;const df=pm?Math.round((mx-pm)*10)/10:null;const ipr=mx===pr&&pr>0;h+=`<div class="hr2"><div style="font-size:10px;color:var(--text3);font-family:var(--mono);min-width:60px">${fmt(e.date)}</div><div style="flex:1"><div style="font-size:12px;font-family:var(--mono)">${e.sets.map((s,j)=>`${s.kg}kg×${s.reps}`).join(" · ")}${ipr?' <span class="prb">PR</span>':""}</div>${e.note?`<div style="font-size:11px;color:var(--text3);margin-top:2px">${e.note}</div>`:""}</div>${df!==null?`<div style="font-size:11px;font-family:var(--mono)" class="${df>0?"up":"dn3"}">${df>0?"+":""}${df}kg</div>`:""}<button onclick="delE(${JSON.stringify(pgex)},${JSON.stringify(e.date)})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px">✕</button></div>`;});}
  h+=`</div></div>`;el.innerHTML=h;
  requestAnimationFrame(()=>{const c=document.getElementById("pgc");if(c){const dpr=window.devicePixelRatio||1;c.width=c.offsetWidth*dpr;c.height=155*dpr;c.style.height="155px";drawC(c,pgex);}});
}
function delE(ex,date){if(!tlog[ex])return;tlog[ex]=tlog[ex].filter(e=>e.date!==date);saveData();rProg();}

// INIT
loadData();render();
</script>
</body>
</html>

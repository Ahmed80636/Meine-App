<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainingsapp PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0E0F11;
            --bg2: #161719;
            --bg3: #1E2024;
            --border: #2A2C31;
            --text: #F0F0EE;
            --text2: #9A9B9F;
            --accent: #C8F23A;
            --claude: #7c4dff;
            --font: 'Syne', sans-serif;
            --mono: 'DM Mono', monospace;
            --r: 12px;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding-bottom: 50px;
        }

        /* Navigation */
        .nav {
            display: flex;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 5px;
            overflow-x: auto;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav button {
            background: none;
            border: none;
            color: var(--text2);
            padding: 10px 15px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .nav button.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        /* Container & Cards */
        .container { padding: 20px; }
        
        .card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 16px;
            margin-bottom: 15px;
        }

        /* Button Styles */
        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
        }

        .btn-ai {
            background: var(--claude);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            width: 100%;
            margin-top: 10px;
        }

        /* Inputs */
        input {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-family: var(--mono);
            width: 100%;
            margin-bottom: 10px;
        }

        #ai-response {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text2);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="nav">
        <button onclick="showPage('plan')" id="btn-plan" class="active">Plan</button>
        <button onclick="showPage('log')" id="btn-log">Loggen</button>
        <button onclick="showPage('ai')" id="btn-ai">KI Coach</button>
    </div>

    <div class="container">
        <!-- SEITE: PLAN -->
        <div id="page-plan">
            <h1 style="font-size: 24px; margin-bottom: 10px;">Dein Training</h1>
            <div id="plan-list">
                <!-- Wird per JS gefüllt -->
            </div>
        </div>

        <!-- SEITE: LOGGEN -->
        <div id="page-log" style="display:none;">
            <div class="card">
                <h3>Übung loggen</h3>
                <input type="text" id="ex-name" placeholder="Name der Übung">
                <input type="number" id="ex-weight" placeholder="Gewicht in kg">
                <input type="number" id="ex-reps" placeholder="Wiederholungen">
                <button class="btn-primary" onclick="saveWorkout()">Speichern</button>
            </div>
        </div>

        <!-- SEITE: KI COACH -->
        <div id="page-ai" style="display:none;">
            <div class="card" style="border-left: 4px solid var(--claude);">
                <div style="display:flex; justify-content: space-between;">
                    <span style="color: var(--claude); font-weight: 800;">CLAUDE AI COACH</span>
                    <button onclick="toggleKey()" style="font-size: 10px; background:none; border:1px solid #333; color: #555;">API KEY</button>
                </div>
                
                <div id="key-input" style="display:none; margin-top:10px;">
                    <input type="password" id="api-key" placeholder="sk-ant-..." onchange="localStorage.setItem('claude_key', this.value)">
                </div>

                <div id="ai-response">Klicke unten, um deine Daten zu analysieren.</div>
                <button class="btn-ai" onclick="runAnalysis()">Analyse & Progression</button>
            </div>
        </div>
    </div>

    <script>
        // Datenbank Simulation
        let logs = JSON.parse(localStorage.getItem('workout_logs') || '[]');

        function showPage(pageId) {
            document.getElementById('page-plan').style.display = pageId === 'plan' ? 'block' : 'none';
            document.getElementById('page-log').style.display = pageId === 'log' ? 'block' : 'none';
            document.getElementById('page-ai').style.display = pageId === 'ai' ? 'block' : 'none';
            
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + pageId).classList.add('active');
        }

        function saveWorkout() {
            const entry = {
                name: document.getElementById('ex-name').value,
                weight: document.getElementById('ex-weight').value,
                reps: document.getElementById('ex-reps').value,
                date: new Date().toISOString()
            };
            logs.push(entry);
            localStorage.setItem('workout_logs', JSON.stringify(logs));
            alert("Erfolg!");
        }

        function toggleKey() {
            const el = document.getElementById('key-input');
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        async function runAnalysis() {
            const key = localStorage.getItem('claude_key');
            if(!key) return alert("Bitte API Key hinterlegen!");

            const display = document.getElementById('ai-response');
            display.innerText = "Claude berechnet deine Steigerung...";

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'x-api-key': key,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json',
                        'dangerously-allow-browser': 'true'
                    },
                    body: JSON.stringify({
                        model: "claude-3-5-sonnet-20240620",
                        max_tokens: 512,
                        messages: [{
                            role: "user", 
                            content: `Analysiere meinen Fortschritt und sag mir, welche Gewichte ich als nächstes nehmen soll. Historie: ${JSON.stringify(logs.slice(-10))}`
                        }]
                    })
                });
                const data = await response.json();
                display.innerHTML = data.content[0].text.replace(/\n/g, '<br>');
            } catch (e) {
                display.innerText = "Fehler: Verbindung zur KI fehlgeschlagen.";
            }
        }
    </script>
</body>
</html>
